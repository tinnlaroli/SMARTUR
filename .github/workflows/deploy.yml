name: Deploy to VPS

on:
  workflow_run:
    workflows: ["CI — Lint, Type Check & Build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    # Solo despliega si el CI pasó (o si se dispara manualmente)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Diagnose SSH connectivity
        run: |
          echo "=== DNS resolution ==="
          nslookup ${{ secrets.VPS_HOST }} || true
          echo "=== Port 22 reachability ==="
          nc -zv ${{ secrets.VPS_HOST }} 22 -w 10 && echo "PORT 22 OPEN" || echo "PORT 22 CLOSED/TIMEOUT"
          echo "=== Port 80 reachability ==="
          nc -zv ${{ secrets.VPS_HOST }} 80 -w 5 && echo "PORT 80 OPEN" || echo "PORT 80 CLOSED"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          envs: DEPLOY_MODE,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/SMARTUR

            # ── 0) Modo de despliegue ──────────────────────────────
            #   build → construye en el VPS (comportamiento actual).
            #   pull  → baja imágenes de GHCR (publicadas por el job
            #           "images" del CI) en vez de compilar en prod.
            #   Se configura con la variable del repo DEPLOY_MODE;
            #   si además se registran GHCR_USER/GHCR_TOKEN (secrets)
            #   hace login a ghcr.io (requerido si el paquete es privado).
            DEPLOY_MODE="${DEPLOY_MODE:-build}"
            echo "DEPLOY_MODE=$DEPLOY_MODE"

            # ── 1) Backup pre-migración (pg_dump + rotación) ───────
            BACKUP_DIR=/opt/SMARTUR/backups
            mkdir -p "$BACKUP_DIR"
            TS=$(date +%Y%m%d_%H%M%S)
            docker exec smartur-postgres pg_dump -U postgres -d smartur -Fc \
              > "$BACKUP_DIR/smartur_$TS.dump"
            echo "✓ Backup creado: $BACKUP_DIR/smartur_$TS.dump ($(du -h "$BACKUP_DIR/smartur_$TS.dump" | cut -f1))"
            ls -t "$BACKUP_DIR"/smartur_*.dump | tail -n +11 | xargs -r rm -f

            # ── 2) Traer el código ─────────────────────────────────
            git stash clear 2>/dev/null || true
            git fetch origin
            git reset --hard origin/main

            # Inyecta Firebase service account desde GitHub Secret (.env está en .gitignore)
            sed -i '/^FIREBASE_SERVICE_ACCOUNT=/d' .env
            echo "FIREBASE_SERVICE_ACCOUNT=${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}" >> .env

            # ── 3) Deploy selectivo: qué servicios cambiaron ───────
            #     Compara el último commit; si no se puede calcular,
            #     reconstruye todo (fallback seguro). Un cambio en
            #     docker-compose.yml afecta a todos.
            PREV=$(git rev-parse origin/main~1 2>/dev/null || true)
            SERVICES=""
            if [ -z "$PREV" ]; then
              echo "⚠ No hay commit previo (rama nueva) → despliega todo"
              SERVICES=" api plataforma landing modelo"
            else
              CHANGED=$(git diff --name-only "$PREV" origin/main 2>/dev/null || true)
              if [ -z "$CHANGED" ]; then
                echo "ℹ Sin cambios en la app → solo recarga nginx y valida salud"
              else
                echo "$CHANGED" | grep -q '^API/' && SERVICES="$SERVICES api"
                echo "$CHANGED" | grep -q '^PLATAFORMA/' && SERVICES="$SERVICES plataforma"
                echo "$CHANGED" | grep -q '^LANDING/' && SERVICES="$SERVICES landing"
                echo "$CHANGED" | grep -q '^MODELO/' && SERVICES="$SERVICES modelo"
                echo "$CHANGED" | grep -q '^docker-compose.yml' && SERVICES=" api plataforma landing modelo"
              fi
            fi

            # Normaliza la lista de servicios (sin espacios sobrantes)
            SERVICES=${SERVICES//  / }
            SERVICES=${SERVICES# }
            SERVICES=${SERVICES% }

            # ── 4) Build o pull + up de los servicios elegidos ─────
            if [ -n "$SERVICES" ]; then
              # Validar que los servicios sí existen en el compose antes de tocar nada
              AVAILABLE=$(docker compose -f docker-compose.yml config --services 2>/dev/null)
              for sv in $SERVICES; do
                if ! echo "$AVAILABLE" | grep -qx "$sv"; then
                  echo "FAIL: servicio '$sv' no existe. Disponibles: $(echo "$AVAILABLE" | tr '\n' ' ')"
                  exit 1
                fi
              done
              echo "Servicios a desplegar:$SERVICES"
              if [ "$DEPLOY_MODE" = "pull" ]; then
                if [ -n "${GHCR_USER:-}" ] && [ -n "${GHCR_TOKEN:-}" ]; then
                  echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
                fi
                echo "> docker compose pull $SERVICES"
                docker compose -f docker-compose.yml pull $SERVICES
                echo "> docker compose up -d --no-deps $SERVICES"
                docker compose -f docker-compose.yml up -d --no-deps $SERVICES
              else
                echo "> docker compose up -d --build --no-deps $SERVICES"
                docker compose -f docker-compose.yml up -d --build --no-deps $SERVICES
              fi
            else
              echo "ℹ Sin servicios app que desplegar"
            fi

            # Fuerza reload de nginx (el config es volume-mount, up -d no lo recarga solo)
            docker compose -f docker-compose.yml exec -T nginx nginx -s reload || true

            # ── 5) Health-gate: espera a que todo esté saludable ───
            wait_health() {
              local c="$1" tries="$2" delay="$3" h=""
              for i in $(seq 1 "$tries"); do
                h=$(docker inspect --format '{{.State.Health.Status}}' "$c" 2>/dev/null || echo missing)
                [ "$h" = "healthy" ] && return 0
                sleep "$delay"
              done
              echo "FAIL health-gate: $c = $h (state: $(docker inspect --format '{{.State.Status}}' "$c" 2>/dev/null || echo none))"
              return 1
            }

            wait_health smartur-api      24 10   # ~4 min (start_period 20s)
            wait_health smartur-plataforma 24 5  # ~2 min
            wait_health smartur-landing    24 5  # ~2 min

            # nginx no tiene healthcheck en compose → validar vía HTTP.
            # En prod el :80 redirige 301→https, así que 200/301/302 valen.
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/ || true)
            case "$code" in 200|301|302) : ;; *)
              echo "FAIL health-gate: nginx HTTP = $code"
              exit 1 ;;
            esac
            echo "✓ smartur-nginx HTTP $code"

            # MODELO: arranque lento si entrena (primer boot / sin modelo)
            wait_health smartur-modelo 60 15    # hasta ~15 min

            # ── 6) Verificación de migraciones ─────────────────────
            if docker logs --since 20m smartur-api 2>&1 | grep -q "\[migration\] ERROR"; then
              echo "FAIL: el runner de migraciones del API reportó errores"
              exit 1
            fi
            MIGS=$(docker exec smartur-postgres psql -U postgres -d smartur -tAc \
              "SELECT count(*) FROM _schema_migrations" 2>/dev/null || echo 0)
            echo "✓ _schema_migrations registradas: $MIGS"

            # ── 7) Limpieza (imágenes huérfanas / caché antigua) ───
            docker image prune -f
            docker builder prune -af --filter until=72h
            docker volume prune -f

            echo "✓ Deploy completado: $(date)"
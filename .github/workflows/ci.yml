name: CI — Lint, Type Check & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancela ejecuciones anteriores del mismo PR para ahorrar minutos
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Necesario para publicar imágenes en GHCR (job "images")
  packages: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # Cambios por servicio (path-gating). Cada job solo corre si su
  # directorio (o infra compartida) cambió.
  # ─────────────────────────────────────────────────────────────
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      plataforma: ${{ steps.filter.outputs.plataforma }}
      landing: ${{ steps.filter.outputs.landing }}
      modelo: ${{ steps.filter.outputs.modelo }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'API/**'
              - 'docker-compose.yml'
              - '.env.example'
              - '.github/workflows/deploy.yml'
            plataforma:
              - 'PLATAFORMA/**'
              - 'docker-compose.yml'
              - '.env.example'
              - '.github/workflows/deploy.yml'
            landing:
              - 'LANDING/**'
              - 'docker-compose.yml'
              - '.env.example'
              - '.github/workflows/deploy.yml'
            modelo:
              - 'MODELO/**'
              - 'docker-compose.yml'
              - '.env.example'
              - '.github/workflows/deploy.yml'
            db:
              - 'API/bd.sql'
              - 'API/config/db.js'
              - '.github/workflows/ci.yml'

  # ─────────────────────────────────────────────────────────────
  # DB — verifica que bd.sql construye el esquema completo en una
  # instalación fresca. bd.sql es la única fuente de verdad del schema.
  # ─────────────────────────────────────────────────────────────
  db-schema:
    name: DB — Schema
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.db == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartur
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Fresh install (import bd.sql on empty DB)
        run: |
          psql -h localhost -U postgres -d smartur -v ON_ERROR_STOP=1 -f API/bd.sql
          TABLES=$(psql -h localhost -U postgres -d smartur -tAc \
            "SELECT count(*) FROM pg_tables WHERE schemaname='public'")
          echo "N tablas = $TABLES"
          [ "$TABLES" -ge "59" ] || { echo "FAIL: se esperaban al menos 59 tablas, hay $TABLES"; exit 1; }
          MW_TABLES=$(psql -h localhost -U postgres -d smartur -tAc \
            "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('wellness_trip_preference_assessment','wellness_recommendation_item_feedback')")
          [ "$MW_TABLES" = "2" ] || { echo "FAIL: faltan tablas de captura M/W, hay $MW_TABLES de 2"; exit 1; }
          MW_COLUMNS=$(psql -h localhost -U postgres -d smartur -tAc \
            "SELECT count(*) FROM information_schema.columns WHERE (table_name IN ('point_of_interest','tourist_service') AND column_name IN ('wellness_motives','wellness_modalities','wellness_mw_evidence','wellness_mw_reviewed_at')) OR (table_name='user' AND column_name='is_seeded')")
          [ "$MW_COLUMNS" = "9" ] || { echo "FAIL: se esperaban 9 columnas M/W y de procedencia, hay $MW_COLUMNS"; exit 1; }
          echo "OK: bd.sql instala el esquema y las tablas/columnas M/W con filtro de cuentas semilla"
        env:
          PGPASSWORD: postgres

  # ─────────────────────────────────────────────────────────────
  # API — ESLint real + unit tests + syntax check
  # ─────────────────────────────────────────────────────────────
  api:
    name: API — Lint & Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    defaults:
      run:
        working-directory: API
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: API/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint; falla si hay errores)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Syntax check (Node --check)
        run: |
          find . -name "*.js" \
            -not -path "./node_modules/*" \
            -not -path "./docs/*" \
            | xargs node --check
        shell: bash

  # ─────────────────────────────────────────────────────────────
  # PLATAFORMA — TypeScript + Vite build
  # ─────────────────────────────────────────────────────────────
  plataforma:
    name: PLATAFORMA — TypeScript & Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.plataforma == 'true'
    defaults:
      run:
        working-directory: PLATAFORMA
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: PLATAFORMA/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build (Vite)
        run: npm run build
        env:
          VITE_API_URL: /api/v2
          VITE_MODELO_URL: http://localhost:8000
          VITE_BUSINESS_URL: http://localhost/

  # ─────────────────────────────────────────────────────────────
  # LANDING — Astro build
  # ─────────────────────────────────────────────────────────────
  landing:
    name: LANDING — Astro Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    defaults:
      run:
        working-directory: LANDING
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: LANDING/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (astro check)
        run: npx astro check

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build (Astro)
        run: npm run build
        env:
          PUBLIC_TOURIST_APP_URL: http://localhost/
          PUBLIC_API_URL: http://localhost:4000/api/v2

  # ─────────────────────────────────────────────────────────────
  # MODELO — Python syntax + imports check
  # ─────────────────────────────────────────────────────────────
  modelo:
    name: MODELO — Python Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.modelo == 'true'
    defaults:
      run:
        working-directory: MODELO
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: MODELO/requirements.txt

      - name: Install dependencies
        run: |
          # lightfm no tiene wheel para Python 3.11 en CI y no puede compilarse desde fuente.
          # Solo se importa dentro del lifespan que SKIP_MODEL_BOOT=1 omite en el import check.
          grep -v "^lightfm" requirements.txt | pip install --quiet -r /dev/stdin

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile src/api.py src/poi_repository.py
          echo "✓ Python syntax OK"

      - name: Import check
        run: |
          cd src
          python -c "import api; print('✓ api module importable')"
        env:
          SKIP_MODEL_BOOT: "1"
          POI_DB_HOST: localhost
          POI_DB_NAME: smartur
          POI_DB_USER: postgres
          POI_DB_PASSWORD: ""

      - name: Unit tests (pytest)
        run: python -m pytest -q
        env:
          SKIP_MODEL_BOOT: "1"
          POI_DB_HOST: localhost
          POI_DB_NAME: smartur
          POI_DB_USER: postgres
          POI_DB_PASSWORD: ""

  # ─────────────────────────────────────────────────────────────
  # GHCR — publica imágenes de los servicios app (en main).
  # Permite al VPS hacer pull en vez de construir en producción.
  # El deploy usa pull solo si se configura DEPLOY_MODE=pull.
  # ─────────────────────────────────────────────────────────────
  images:
    name: Images — Push GHCR
    runs-on: ubuntu-latest
    needs: changes
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.api == 'true' ||
       needs.changes.outputs.plataforma == 'true' ||
       needs.changes.outputs.landing == 'true' ||
       needs.changes.outputs.modelo == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        if: needs.changes.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: API
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smartur-api:latest
            ghcr.io/${{ github.repository_owner }}/smartur-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push PLATAFORMA
        if: needs.changes.outputs.plataforma == 'true'
        uses: docker/build-push-action@v6
        with:
          context: PLATAFORMA
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smartur-plataforma:latest
            ghcr.io/${{ github.repository_owner }}/smartur-plataforma:${{ github.sha }}
          build-args: |
            VITE_API_URL=/api/v2
            VITE_MODELO_URL=http://modelo:8000
            VITE_BUSINESS_URL=https://smartur.online/

      - name: Build & push LANDING
        if: needs.changes.outputs.landing == 'true'
        uses: docker/build-push-action@v6
        with:
          context: LANDING
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smartur-landing:latest
            ghcr.io/${{ github.repository_owner }}/smartur-landing:${{ github.sha }}
          build-args: |
            PUBLIC_TOURIST_APP_URL=https://app.smartur.online/
            PUBLIC_API_URL=https://api.smartur.online/api/v2
            PUBLIC_SITE_URL=https://smartur.online

      - name: Build & push MODELO
        if: needs.changes.outputs.modelo == 'true'
        uses: docker/build-push-action@v6
        with:
          context: MODELO
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smartur-modelo:latest
            ghcr.io/${{ github.repository_owner }}/smartur-modelo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
